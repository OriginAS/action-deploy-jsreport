name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 5 1 * *'   # monthly, 1st at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Without the event_name check the job is skipped on push/schedule:
    # github.event.pull_request.draft is null there.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: OriginAS/origin-actions/.github/workflows/codeql.yml@f72ac0ab464a0462cef5cd7eca7f562206c26edf # main
    secrets: inherit
